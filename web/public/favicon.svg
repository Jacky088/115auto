<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <clipPath id="squircle">
      <rect width="512" height="512" rx="112"/>
    </clipPath>
  </defs>

  <g clip-path="url(#squircle)">
    <!-- 1. 纯白背景 -->
    <rect width="512" height="512" fill="#ffffff"/>

    <!-- 2. 下半部：品牌蓝底山峰曲线（适度上移至 338） -->
    <path d="M 0 388 C 152 338, 360 338, 512 388 L 512 512 L 0 512 Z" fill="#2278f8"/>

    <!-- 3. 上半部：115 经典艺术云朵标志 -->
    <path d="M 256.0 205.60
             A 67.64 67.64 0 1 1 323.64 273.24
             L 188.36 273.24
             A 67.64 67.64 0 0 1 181.70 138.28
             A 74.76 74.76 0 1 1 330.30 138.28"
          fill="none"
          stroke="#2278f8"
          stroke-width="30.3"
          stroke-linecap="round"
          stroke-linejoin="round"/>

    <!-- 4. 下半部：115转存助手 纯白文字（位置固定不变） -->
    <text x="256" y="445" text-anchor="middle"
          font-family="'Microsoft YaHei', 'PingFang SC', 'Segoe UI', sans-serif"
          font-size="44" font-weight="bold" fill="#ffffff">115转存助手</text>
  </g>

  <!-- 浅色外边框勾勒 -->
  <rect width="512" height="512" rx="112" fill="none" stroke="rgba(0,0,0,0.08)" stroke-width="2"/>
</svg>
