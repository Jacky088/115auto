name: CI

on:
  push:
    branches: [main]
    paths: [backend/**, tests/**, web/src/**, web/package*.json, .github/workflows/ci.yml]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements.txt pytest
      - run: python -m pytest tests --ignore=tests/test_api_integration.py --ignore=tests/test_worker_mock.py -q
      - run: python tests/test_worker_mock.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
