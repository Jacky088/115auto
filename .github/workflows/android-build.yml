name: Android APK

# 触发：push v* 标签（发版自动出 APK 挂 Release）/ 手动触发（Artifacts 可下载）
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# 签名密钥（可选，配好后升级可覆盖安装）：
#   1. 本机或 CI 生成一次 keystore（keytool -genkeypair -v -keystore autosave115.keystore -alias autosave115 \
#      -keyalg RSA -keysize 2048 -validity 10000），记住三个口令
#   2. 仓库 Settings → Secrets and variables → Actions 逐个添加：
#      ANDROID_KEYSTORE_BASE64（keystore 文件 base64：base64 -w0 autosave115.keystore）
#      ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD
#   3. 不配置也能出包（回退调试签名，仅适合自装体验；升级需先卸载旧版）

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_NAME: ${{ github.ref_name }}
      VERSION_CODE: ${{ github.run_number }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: 解码签名密钥（如已配置）
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/keystore.keystore

      - name: 构建 Release APK
        run: gradle -p android clean assembleRelease --no-daemon

      - name: 整理产物名
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk \
             "dist/Autosave115-${VERSION_NAME#v}.apk"

      - name: 上传构建产物（Artifacts）
        uses: actions/upload-artifact@v4
        with:
          name: Autosave115-APK-${{ github.run_number }}
          path: dist/*.apk

      - name: 发布 APK 到 Release（仅标签触发）
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK=$(ls dist/*.apk)
          gh release upload "${GITHUB_REF_NAME}" "$APK" --clobber --repo "$GITHUB_REPOSITORY" \
            || gh release create "${GITHUB_REF_NAME}" "$APK" --generate-notes --repo "$GITHUB_REPOSITORY"
