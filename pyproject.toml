[tool.ruff]
target-version = "py312"
line-length = 120
# 仅做「能抓出真实故障」的静态检查，风格类规则交给编辑器/人工，避免一次性制造大量无关 diff
extend-exclude = [".venv", "data", "scratch", "web", "android", "backend/static"]

[tool.ruff.lint]
# 仅做「能抓出真实故障」的静态检查：E9 语法错误、F pyflakes、B bugbear 高价值缺陷规则
select = ["E9", "F", "B"]
# B008: FastAPI Depends/Query 默认参数写法；其余为风格或已确认安全项，避免无关 diff
ignore = ["B008", "B011", "B023", "B904", "B905"]
